<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>나의 현황판</title>
<style>
:root{color-scheme:light dark;--bg:#f2f5f8;--card:#fff;--ink:#172b3a;--muted:#526372;--line:#dce4eb;--accent:#156c64;--soft:#e2f2ef;--green:#18714c;--yellow:#866100;--red:#bb303b;--warn:#fff0c9;--warnink:#704a00}
@media(prefers-color-scheme:dark){:root{--bg:#101a22;--card:#1b2833;--ink:#edf4fa;--muted:#b4c3d0;--line:#354651;--accent:#71d9c9;--soft:#24443f;--green:#73d5a4;--yellow:#f2cf68;--red:#ff929a;--warn:#47391b;--warnink:#ffe1a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:640px;margin:auto;padding:24px 16px 40px}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:700;padding:10px 18px}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;letter-spacing:-1px;margin:4px 0}h2{font-size:21px;margin:26px 0 12px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:750;color:var(--accent)}.sub,.muted{color:var(--muted)}.sub{margin:0 0 22px;font-size:15px}.lock{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px}.status{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--soft);margin:16px 0;overflow-wrap:anywhere}.status.warn{background:var(--warn);color:var(--warnink);font-weight:700}.cards{display:grid;gap:12px}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 4px 18px #00000004}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:19px}.stale{font-size:12px;color:var(--warnink);background:var(--warn);border-radius:6px;padding:3px 7px}.big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.3;margin:12px 0 0}.big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:5px}.yesterday{font-size:14px;color:var(--muted);margin-top:3px}.chart{display:flex;gap:9px;height:85px;margin-top:20px;align-items:stretch}.day{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.bararea{height:60px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{background:var(--line);width:75%;border-radius:5px 5px 2px 2px;min-height:2px}.day.latest{color:var(--accent);font-weight:750}.latest .bar{background:var(--accent)}.metric{margin-top:17px}.metricline{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.metricline .label{font-size:15px}.value{font-size:19px;font-weight:750}.state{font-size:12px;margin-left:6px}.track{height:9px;border-radius:10px;background:var(--line);margin:7px 0;overflow:hidden}.fill{height:100%;border-radius:inherit;background:currentColor}.reset{font-size:13px;color:var(--muted);min-height:20px}.good{color:var(--green)}.care{color:var(--yellow)}.low{color:var(--red)}.unknown{color:var(--muted)}.gate{margin-top:45px;padding:26px 22px}.gate h2{margin-top:0;font-size:24px}.gate label{display:block;margin-bottom:8px;font-weight:650}.gate input{width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.gate button{width:100%;margin-top:14px}.error{font-size:14px;color:var(--red);min-height:22px;margin-top:10px}.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
#blogs{gap:8px}#blogs .card{padding:10px 14px;border-radius:16px}#blogs .big{font-size:30px;line-height:1.15;margin-top:2px}#blogs .chart{height:44px;margin-top:4px}#blogs .bararea{height:24px}#blogs .yesterday{font-size:12px;line-height:1.35}#dashboard>h2:first-of-type{font-size:18px}
#blogs .change{font-size:12px;margin-top:3px;color:var(--accent)}#blogs .interval-title{font-size:11px;color:var(--muted);margin-top:3px}#blogs .intervals{display:flex;gap:4px;height:34px;align-items:stretch}#blogs .interval{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--muted)}#blogs .interval-value{height:13px;line-height:13px;white-space:nowrap}#blogs .interval-area{height:21px;width:100%;display:flex;align-items:flex-end;justify-content:center}#blogs .interval .bar{background:var(--muted);width:80%;border-radius:2px 2px 0 0}#blogs .interval.latest{color:var(--accent);font-weight:750}#blogs .interval.latest .bar{background:var(--accent)}#blogs .interval.prev .bar{background:var(--line)}
</style>
<main>
  <header class="top"><div><div class="eyebrow">MY DAILY BOARD</div><h1>나의 현황판</h1></div><button id="lock" class="lock" aria-label="암호를 잊고 잠그기" hidden>🔒</button></header>
  <p class="sub">블로그도, AI도. 지금 한눈에.</p>
  <section id="gate" class="card gate"><h2>반가워요 👋</h2><p class="sub">암호를 입력하면 나의 현황이 열려요.<br>이 기기에서는 다음부터 바로 열려요.</p><form id="form"><label for="password">현황판 암호</label><input id="password" type="password" autocomplete="current-password" required><button id="open" type="submit">현황판 열기</button></form><div id="error" class="error" role="alert"></div></section>
  <div id="dashboard" hidden><div id="status" class="status" role="status" aria-live="polite"></div><h2>블로그 방문자 · 오늘</h2><div id="blogs" class="cards"></div><h2>AI 남은 한도</h2><div id="ai" class="cards"></div><p class="foot">5분마다 새 자료 확인 · 시간은 한국 기준<br>미확인은 한도 정보를 받지 못한 항목이에요.</p></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='my-board-password';
let password='', data=null, refreshing=false, session=0, fetchFailed=false;
const kstDay=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const clock=d=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d);
const number=v=>v==null?'미확인':v.toLocaleString('ko-KR');
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function stale(at){return !at||Date.now()-new Date(at).getTime()>30*60000;}
function heading(item,missing=null){const h=element('div','cardhead');h.append(element('h3','',item.name));if(missing===true||(missing===null&&stale(item.ok_at))){const s=element('span','stale',missing===true?'미확인':item.ok_at?'오래됨':'미확인');s.title=item.ok_at?'마지막 성공 '+new Date(item.ok_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'성공한 조회 없음';h.append(s);}return h;}
function resetText(at){if(!at)return '초기화 미확인';const d=new Date(at);if(!Number.isFinite(d.getTime()))return '초기화 미확인';if(kstDay(d)===kstDay(new Date()))return '초기화 오늘 '+clock(d);const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).formatToParts(d);const p=t=>parts.find(x=>x.type===t)?.value;return `초기화 ${p('month')}/${p('day')}(${p('weekday')}) ${clock(d)}`;}
function appendTodayLog(card,item,today){
  const log=item.today_log_date===today?(item.today_log||[]):[], intervals=log.slice(1).map((row,i)=>({from:log[i].t,to:row.t,value:row.count-log[i].count})).slice(-16), last=intervals.at(-1);
  const ylog=[{t:'00:00',count:0},...(item.today_log_date===today?(item.yesterday_log||[]):[])], mins=s=>+s.slice(0,2)*60+ +s.slice(3);
  const Y=s=>{const m=mins(s);if(ylog.length<2||m>mins(ylog.at(-1).t))return null;const j=ylog.findIndex(r=>mins(r.t)>=m);if(j<=0)return ylog[0].count;const a=ylog[j-1],b=ylog[j],span=mins(b.t)-mins(a.t);return Math.round(a.count+(b.count-a.count)*(span?(m-mins(a.t))/span:1));};
  intervals.forEach(d=>{const a=Y(d.from),b=Y(d.to);d.prev=a==null||b==null?null:Math.max(0,b-a);});
  const nowY=log.length?Y(log.at(-1).t):null;
  card.append(element('div','change',(!last?'다음 갱신부터 표시':last.value<0?'최근 30분 —':`최근 30분 +${number(last.value)}명 (${last.from}→${last.to})`)+(nowY==null?'':` · 어제 이 시각 ${number(nowY)}명`),element('div','interval-title','오늘 30분별 증가'));
  const chart=element('div','intervals');chart.setAttribute('role','img');chart.setAttribute('aria-label',intervals.length?intervals.map(d=>`${d.from}→${d.to} ${d.value<0?'—':number(d.value)+'명'}`).join(', '):'다음 갱신부터 표시');
  const max=Math.max(0,...intervals.map(d=>d.value)), peak=intervals.findIndex(d=>d.value===max);
  intervals.forEach((d,i)=>{const latest=i===intervals.length-1,col=element('div','interval'+(latest?' latest':'')),area=element('div','interval-area'),bar=element('div','bar');col.title=`${d.from}→${d.to} ${d.value<0?'—':number(d.value)+'명'}`;bar.style.height=d.value>0?Math.max(2,d.value/Math.max(1,max,...intervals.map(x=>x.prev||0))*21)+'px':'0';bar.style.minHeight=d.value>0?'2px':'0';area.append(bar);col.append(element('span','interval-value',(i===peak||latest)?(d.value<0?'—':number(d.value)):''),area);chart.append(col);});
  card.append(chart);
  if(intervals.some(d=>d.prev!=null)){card.append(element('div','interval-title','어제 같은 시간'));const ychart=element('div','intervals');ychart.setAttribute('role','img');ychart.setAttribute('aria-label',intervals.map(d=>`어제 ${d.from}→${d.to} ${d.prev==null?'없음':number(d.prev)+'명'}`).join(', '));
    const ymax=Math.max(1,max,...intervals.map(d=>d.prev||0)), ytop=Math.max(...intervals.map(x=>x.prev||0)), ypeak=intervals.findIndex(d=>d.prev===ytop);
    intervals.forEach((d,i)=>{const latest=i===intervals.length-1,col=element('div','interval prev'),area=element('div','interval-area'),bar=element('div','bar');col.title=`어제 ${d.from}→${d.to} ${d.prev==null?'없음':number(d.prev)+'명'}`;bar.style.height=d.prev>0?Math.max(2,d.prev/ymax*21)+'px':'0';area.append(bar);col.append(element('span','interval-value',(i===ypeak||latest)&&d.prev!=null?number(d.prev):''),area);ychart.append(col);});
    card.append(ychart);}
}
function render(){if(!data)return;const today=kstDay(new Date()), yesterday=kstDay(new Date(Date.now()-86400000));$('blogs').replaceChildren();$('ai').replaceChildren();
  for(const item of Object.values(data.blogs)){const card=element('article','card'), byDate=new Map((item.days||[]).map(d=>[d.date,d.count])), count=byDate.get(today), prior=byDate.get(yesterday);card.append(heading(item,false));const big=element('div','big',count==null?'아직 없음':number(count));if(count!=null)big.append(element('small','','명'));card.append(big,element('div','yesterday',`오늘 · ${item.ok_at?clock(new Date(item.ok_at))+' 기준':'아직 없음'}`),element('div','yesterday',prior==null?'어제 아직 없음':`어제 ${number(prior)}명 (확정)`));
    appendTodayLog(card,item,today);const chart=element('div','chart');chart.setAttribute('role','img');const recent=Array.from({length:5},(_,i)=>{const date=kstDay(new Date(Date.now()-(4-i)*86400000));return {date,count:byDate.get(date)};});chart.setAttribute('aria-label',recent.map(d=>`${d.date} ${number(d.count)}`).join(', '));const max=Math.max(1,...recent.map(d=>d.count||0));for(const d of recent){const col=element('div','day'+(d.date===today?' latest':'')), area=element('div','bararea'),bar=element('div','bar');bar.style.height=d.count==null?'0':Math.max(2,d.count/max*24)+'px';if(d.count==null)bar.style.display='none';col.title=d.date+' '+number(d.count);area.append(bar);col.append(area,element('span','',d.date.slice(5).replace('-','/')));chart.append(col);}card.append(chart);$('blogs').append(card);}
  for(const item of Object.values(data.ai)){const card=element('article','card');card.append(heading(item));for(const [key,label] of [['five_hour','5시간'],['seven_day','1주']]){const w=item[key]||{}, n=w.remaining,known=typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=100, cls=!known?'unknown':n>=50?'good':n>=20?'care':'low',state=!known?'미확인':n>=50?'여유':n>=20?'주의':'부족';const metric=element('div','metric'),line=element('div','metricline'),v=element('span','value '+cls,known?`${Math.round(n)}%`:'미확인');if(known)v.append(element('span','state',state));line.append(element('span','label',label+' 남음'),v);const track=element('div','track '+cls),fill=element('div','fill');fill.style.width=(known?n:0)+'%';track.setAttribute('role','meter');track.setAttribute('aria-label',label+' 남은 한도');if(known){track.setAttribute('aria-valuenow',n);track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');}track.setAttribute('aria-valuetext',known?`${Math.round(n)}% ${state}`:'미확인');track.append(fill);metric.append(line,track,element('div','reset',resetText(w.reset_at)));card.append(metric);}$('ai').append(card);}updateStatus();}
function updateStatus(){if(!data)return;const mins=Math.max(0,Math.floor((Date.now()-new Date(data.generated_at).getTime())/60000)), old=stale(data.generated_at)||Object.values(data.ai).some(item=>stale(item.ok_at));const s=$('status');s.classList.toggle('warn',old||fetchFailed);s.textContent=old?(stale(data.generated_at)?`⚠️ ${mins}분 전 갱신 — 노트북이 꺼져 있을 수 있어요`:'⚠️ AI 한도 갱신이 늦거나 미확인인 항목이 있어요'):fetchFailed?'⚠️ 새 자료를 받지 못했어요 — 마지막 자료 표시 중':'✅ '+clock(new Date(data.generated_at))+' 갱신';}
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function readData(pw){const response=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('fetch');const e=await response.json();if(e.v!==1)throw new Error('version');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(e.salt),iterations:200000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(e.iv)},aes,bytes(e.ct));const value=JSON.parse(new TextDecoder().decode(plain));if(!value.blogs||!value.ai||!Number.isFinite(new Date(value.generated_at).getTime()))throw new Error('data');return value;}
async function unlock(pw){const token=++session;$('error').textContent='';$('open').disabled=true;try{const result=await readData(pw);if(token!==session)return;password=pw;data=result;fetchFailed=false;try{localStorage.setItem(KEY,pw);}catch{}$('password').value='';$('gate').hidden=true;$('dashboard').hidden=false;$('lock').hidden=false;render();}catch{if(token===session){$('error').textContent='열지 못했어요. 암호와 인터넷 연결을 확인해 주세요.';try{localStorage.removeItem(KEY);}catch{}}}finally{$('open').disabled=false;}}
$('form').addEventListener('submit',e=>{e.preventDefault();unlock($('password').value);});
$('lock').addEventListener('click',()=>{session++;password='';data=null;try{localStorage.removeItem(KEY);}catch{}$('blogs').replaceChildren();$('ai').replaceChildren();$('status').textContent='';$('dashboard').hidden=true;$('lock').hidden=true;$('gate').hidden=false;$('error').textContent='';$('password').focus();});
async function refresh(){if(!password||refreshing)return;refreshing=true;const token=session;try{const result=await readData(password);if(token===session){data=result;fetchFailed=false;render();}}catch{if(token===session){fetchFailed=true;updateStatus();}}finally{refreshing=false;}}
setInterval(refresh,5*60000);setInterval(()=>{if(data)render();},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(data)render();refresh();}});
try{const saved=localStorage.getItem(KEY);if(saved)unlock(saved);}catch{}
</script>
</html>
